on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  document-and-dispatch:
    name: document
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'
      - name: Delete-Namespace
        run: Rscript -e 'file.remove("NAMESPACE")'
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::cffr, any::covr
          needs: check

      - name: Document
        run: |
          roxygen2::roxygenise()
          if (file.exists("CITATION.cff")) cffr::cff_write()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2

      - name: Test coverage
        if: github.event_name == 'push'
        run: |
          covr::codecov()
        shell: Rscript {0}

      - name: Commit generated documentation
        if: github.event_name == 'push'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A -f -- man NAMESPACE
          if git ls-files --error-unmatch CITATION.cff >/dev/null 2>&1; then
            git add CITATION.cff
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Documentation'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
